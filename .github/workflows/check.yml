name: SHINO CONTROL checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check server-entry.mjs
          node --check lib/derive.mjs
          node --check lib/resume-engine.mjs
          node --check lib/status-engine.mjs
          node --check lib/state-store.mjs
          node --check lib/state-mutation-queue.mjs
          node --check lib/github-sync-commit.mjs
          node --check scripts-state-concurrency-check.mjs
          node --check lib/http-security.mjs
          node --check scripts-security-check.mjs
          node --check scripts-extension-security-check.mjs
          node --check scripts-http-server-check.mjs
          node --check lib/public-snapshot.mjs
          node --check lib/github-incremental-sync.mjs
          node --check lib/chatgpt-delta-ingest.mjs
          node --check lib/chatgpt-catchup-plan.mjs
          node --check lib/chatgpt-project-ownership.mjs
          node --check lib/chatgpt-tail-state.mjs
          node --check lib/resolver.mjs
          node --check scripts-check.mjs
          node --check scripts-status-check.mjs
          node --check scripts-derivation-cache-check.mjs
          node --check scripts-github-cursor-check.mjs
          node --check scripts-chatgpt-delta-check.mjs
          node --check scripts-chatgpt-catchup-check.mjs
          node --check scripts-chatgpt-project-ownership-check.mjs
          node --check scripts-chatgpt-tail-state-check.mjs
          node --check scripts-focus-now-check.mjs
          node --check scripts-sync-health-check.mjs
          node --check scripts-ui-v10-check.mjs
          node --check scripts-ui-premium-check.mjs
          node --check scripts-project-management-check.mjs
          node --check scripts-source-manager-check.mjs
          node --check scripts-drag-drop-check.mjs
          node --check scripts-project-arrange-check.mjs
          node --check scripts-runtime-state-check.mjs
          node --check scripts-tray-check.mjs
          node --check scripts/repair-state.mjs
          node --check scripts/generate-build-info.mjs
          node --check scripts/generate-pages-snapshot.mjs
          node --check scripts/chatgpt-state-hygiene.mjs
          node --check scripts/build-pages.mjs
          node --check extension/control-collector/control-endpoint.js
          node --check extension/control-collector/background.js
          node --check extension/control-collector/collector.js
          node --check extension/control-collector/catchup-api.js
          node --check extension/control-collector/catchup-client.js
          node --check public/state-filter.js
          node --check public/site-bootstrap.js
          node --check public/focus-engine.js
          node --check public/focus-now.js
          node --check public/sync-health.js
          node --check public/radar-copy-cleaner.js
          node --check public/app.js
      - name: PowerShell startup syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @(
            'scripts/windows/control-supervisor.ps1',
            'scripts/windows/install-startup.ps1',
            'scripts/windows/startup-status.ps1',
            'scripts/windows/uninstall-startup.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PowerShell parse errors in $file"
              $errors | ForEach-Object { Write-Host $_ }
            }
          }
          if ($failed) { exit 1 }
      - name: Generate build metadata
        run: npm run assets
      - name: Verify CONTROL-only architecture
        run: |
          test -s public/build-info.js
          grep -q 'BUILD v' public/build-info.js
          grep -q '0.13.0' public/build-info.js
          test -s extension/control-collector/manifest.json
          grep -q 'SHINO // CONTROL Collector' extension/control-collector/manifest.json
          grep -q '"version": "0.2.10"' extension/control-collector/manifest.json
          test -s extension/control-collector/control-endpoint.js
          grep -q '"alarms"' extension/control-collector/manifest.json
          grep -q '"scripting"' extension/control-collector/manifest.json
          test -s extension/control-collector/catchup-api.js
          test -s extension/control-collector/catchup-client.js
          grep -q 'chatgpt-project-api-metadata-v1' extension/control-collector/catchup-api.js
          grep -q '/backend-api/conversation/' extension/control-collector/catchup-api.js
          grep -q 'DEFAULT_FETCH_TIMEOUT_MS = 30000' extension/control-collector/catchup-api.js
          grep -q 'SLOW_FETCH_TIMEOUT_MS = 90000' extension/control-collector/catchup-api.js
          grep -q 'DEEP_SLOW_FETCH_TIMEOUT_MS = 120000' extension/control-collector/catchup-api.js
          grep -q 'conversationFetchTimeout' extension/control-collector/catchup-api.js
          grep -q 'FETCH_CONCURRENCY = 1' extension/control-collector/catchup-api.js
          grep -q 'FETCH_MAX_ATTEMPTS = 1' extension/control-collector/catchup-api.js
          grep -q 'FETCH_INTER_ITEM_DELAY_MS = 1500' extension/control-collector/catchup-api.js
          grep -q "RATE_LIMIT_FAILURE = {kind:'rate-limited'}" extension/control-collector/catchup-api.js
          grep -q "kind:'inaccessible'" extension/control-collector/catchup-api.js
          grep -q '__SHINO_CONTROL_COLLECTOR_V1__' extension/control-collector/collector.js
          grep -q '__SHINO_CONTROL_CATCHUP_CLIENT_V1__' extension/control-collector/catchup-client.js
          grep -q "CLIENT_VERSION = '0.2.10'" extension/control-collector/catchup-client.js
          grep -q 'ACTIVE_REQUEST_STALE_MS = 20 \* 60 \* 1000' extension/control-collector/catchup-client.js
          grep -q 'CLIENT_RUNNING_STALE_MS = 20 \* 60 \* 1000' extension/control-collector/catchup-client.js
          grep -q 'CLIENT_PARTIAL_COOLDOWN_MS = 10 \* 60 \* 1000' extension/control-collector/catchup-client.js
          grep -q 'RATE_LIMIT_COOLDOWN_MS = 15 \* 60 \* 1000' extension/control-collector/catchup-client.js
          grep -q 'EXECUTION_PLAN_LIMIT = 8' extension/control-collector/catchup-client.js
          grep -q 'CONTROL_CATCHUP_PING' extension/control-collector/catchup-client.js
          grep -q 'CONTROL_CATCHUP_TICK' extension/control-collector/catchup-client.js
          grep -q 'CATCHUP_RETRY_INTERVAL_MS = 10 \* 60 \* 1000' extension/control-collector/background.js
          grep -q 'CATCHUP_RUNNING_STALE_MS = 20 \* 60 \* 1000' extension/control-collector/background.js
          grep -q "CATCHUP_ALARM_NAME = 'shino-control-catchup-tick'" extension/control-collector/background.js
          grep -q "CATCHUP_RECOVERY_FILES = \['collector.js','catchup-api.js','catchup-client.js'\]" extension/control-collector/background.js
          grep -q 'chrome.scripting.executeScript' extension/control-collector/background.js
          grep -q 'catchupRunOwnerTabId' extension/control-collector/background.js
          grep -q 'CATCHUP_RUN_OWNED_BY_TAB_' extension/control-collector/background.js
          grep -q 'chrome.alarms.onAlarm' extension/control-collector/background.js
          grep -q 'catchupSchedulerLastClientVersion' extension/control-collector/background.js
          grep -q 'CONTROL_CATCHUP_PLAN' extension/control-collector/background.js
          grep -q '__SHINO_CONTROL_CHATGPT_API_V1__' extension/control-collector/catchup-api.js
          ! grep -q '"world": "MAIN"' extension/control-collector/manifest.json
          ! grep -R -q 'window\.postMessage' extension/control-collector
          test ! -e extension/control-collector/catchup-main.js
          grep -q '/api/chatgpt/catchup-plan' server-entry.mjs
          grep -q '/api/chatgpt/catchup-report' server-entry.mjs
          grep -q '/api/control/restart' server-entry.mjs
          grep -q '/api/projects/update' server-entry.mjs
          grep -q '/api/projects/create' server-entry.mjs
          grep -q '/api/projects/bulk' server-entry.mjs
          grep -q '/api/projects/reorder' server-entry.mjs
          grep -q '/api/sources/move' server-entry.mjs
          grep -q '/api/sources/archive' server-entry.mjs
          grep -q '/api/discovered/assign' server-entry.mjs
          grep -q 'normalizedManagedControl' server-entry.mjs
          grep -q 'resolveManualSourceAssignment' lib/chatgpt-delta-ingest.mjs
          grep -q 'chatgptInaccessible' server-entry.mjs
          grep -q 'chatgptTimeoutQuarantine' server-entry.mjs
          grep -q 'TIMEOUT_RETRY_DELAYS_MS' server-entry.mjs
          grep -q 'timeoutQuarantineCleared' server-entry.mjs
          grep -q 'inaccessibleCount' lib/chatgpt-catchup-plan.mjs
          grep -q 'timeoutQuarantinedCount' lib/chatgpt-catchup-plan.mjs
          grep -q 'unchangedCount' server-entry.mjs
          grep -q 'failures' server-entry.mjs
          test -s lib/chatgpt-project-ownership.mjs
          grep -q 'live ChatGPT project title' lib/chatgpt-project-ownership.mjs
          grep -q 'project-ownership-mismatch' lib/chatgpt-catchup-plan.mjs
          test -s lib/chatgpt-tail-state.mjs
          grep -q 'CHATGPT_STATE_SCHEMA_VERSION = 2' lib/chatgpt-tail-state.mjs
          grep -q 'state-schema-upgrade' lib/chatgpt-catchup-plan.mjs
          grep -q 'chatgptStateSchemaVersion' lib/chatgpt-delta-ingest.mjs
          grep -q 'deferred to next catch-up batch' extension/control-collector/background.js
          test -s scripts/windows/control-supervisor.ps1
          test -s scripts/windows/install-startup.ps1
          test -s scripts/windows/startup-status.ps1
          test -s scripts/windows/uninstall-startup.ps1
          test -s scripts/windows/ShinoControlTray.cs
          grep -q 'SHINO_CONTROL_Core' scripts/windows/install-startup.ps1
          grep -q 'SHINO_CONTROL_Tray' scripts/windows/install-startup.ps1
          grep -q 'OutputType WindowsApplication' scripts/windows/install-startup.ps1
          grep -q 'WindowStyle Hidden' scripts/windows/install-startup.ps1
          grep -q 'NotifyIcon' scripts/windows/ShinoControlTray.cs
          grep -q 'CreateControlIcon' scripts/windows/ShinoControlTray.cs
          grep -q 'Restart CONTROL Core' scripts/windows/ShinoControlTray.cs
          grep -q '127.0.0.1' scripts/windows/control-supervisor.ps1
          test -s public/focus-engine.js
          test -s public/focus-now.js
          test -s public/focus-now.css
          test -s public/sync-health.js
          test -s public/sync-health.css
          test -s public/radar-copy-cleaner.js
          test -s lib/state-store.mjs
          grep -q 'state.local.json' .gitignore
          grep -q 'runtimeStatePath' server-entry.mjs
          test ! -e server.mjs
          grep -q 'const server = http.createServer' server-entry.mjs
          ! grep -q 'http.createServer = ' server-entry.mjs
          ! grep -q "import('./server.mjs')" server-entry.mjs
          test -s public/ui-v10.css
          grep -q 'PREMIUM FEEL PASS' public/ui-v10.css
          test -s public/ui-v3.css
          grep -q 'CONTROL UI v3' public/ui-v3.css
          for retired in ui-v2.css ui-v4.css ui-v5.css ui-v6.css ui-v8.css ui-v9.css ui-v11.css ui-v12.css ui-v13.css; do
            test ! -e "public/$retired"
            ! grep -q "$retired" public/index.html
          done
          test -s public/ui-premium.css
          grep -q 'Premium Presentation Layer v1' public/ui-premium.css
          test -s public/project-manager.css
          grep -q 'Project Management Layer v1' public/project-manager.css
          test -s public/source-manager.css
          grep -q 'Source Manager v1' public/source-manager.css
          test -s public/drag-drop.css
          grep -q 'Drag & Drop Interaction Layer v1' public/drag-drop.css
          grep -q 'v0.13.0 — precise reorder targets' public/drag-drop.css
          grep -q 'v0.13.0 — bulk project control' public/project-manager.css
          grep -q 'project-manager.css' public/index.html
          grep -q 'source-manager.css' public/index.html
          grep -q 'drag-drop.css' public/index.html
          grep -q 'function bindControlDragDrop' public/app.js
          grep -q 'data-drop-status' public/app.js
          grep -q 'data-drop-group' public/app.js
          grep -q 'data-source-drop-project' public/app.js
          grep -q 'data-drop-project-order' public/app.js
          grep -q 'data-bulk-project' public/app.js
          grep -q 'function bulkManagedProjectPatch' public/app.js
          grep -q 'function reorderManagedProject' public/app.js
          grep -q 'function setUndo' public/app.js
          grep -q 'function projectManagerModal' public/app.js
          grep -q 'function groupedProjectsPanel' public/app.js
          grep -q 'ui-premium.css' public/index.html
          test -s public/assets/ui/backgrounds/dashboard-hero-master.avif
          test -s public/assets/ui/backgrounds/project-hero-master.avif
          test -s public/assets/ui/brand/brand-emblem.avif
          grep -q 'PROJECT_VISUAL_FAMILIES' public/app.js
          grep -q 'projectVisualProfile' public/app.js
          grep -q 'ui-v10.css' public/index.html
          test -s public/assets/dashboard-premium.webp
          test -s public/assets/project-premium.webp
          test -s public/assets/control-hero-v9.svg
          test -s public/assets/project-hero-v9.svg
          test -s public/assets/control-mountains.svg
          test -s public/assets/project-workflow-art.svg
          grep -q 'function projectPage' public/app.js
          grep -q 'premiumProjectBoard' public/app.js
          grep -q 'view-${view}' public/app.js
          grep -q 'FOCUS NOW' public/focus-now.js
          grep -q 'CHATGPT SYNC HEALTH' public/sync-health.js
          grep -q 'Transient failed' public/sync-health.js
          grep -q 'Slow deferred' public/sync-health.js
          grep -q 'Unavailable / ignored' public/sync-health.js
          grep -q '.card .summary' public/radar-copy-cleaner.js
          grep -q '.modal .big-state' public/radar-copy-cleaner.js
          grep -q '.modal .event p' public/radar-copy-cleaner.js
          test ! -e extension/shino-sync
          test ! -e lib/chatgpt-inventory.mjs
          test ! -e scripts/generate-brand-assets.mjs
          if grep -q '/api/ingest/chatgpt-inventory' server-entry.mjs; then
            echo 'Retired ChatGPT inventory endpoint still present'
            exit 1
          fi
      - name: Derived-state regression checks
        run: npm run check
      - name: GitHub Pages build
        run: |
          npm run build:pages
          test -s dist/index.html
          test -s dist/state.json
          test -s dist/app.js
          test -s dist/focus-engine.js
          test -s dist/focus-now.js
          test -s dist/focus-now.css
          test -s dist/sync-health.js
          test -s dist/sync-health.css
          test -s dist/radar-copy-cleaner.js
          test -s dist/ui-v3.css
          test -s dist/ui-v10.css
          test -s dist/ui-premium.css
          test -s dist/project-manager.css
          test -s dist/source-manager.css
          test -s dist/drag-drop.css
          test -s dist/assets/ui/backgrounds/dashboard-hero-master.avif
          test -s dist/assets/ui/backgrounds/project-hero-master.avif
          test -s dist/assets/ui/brand/brand-emblem.avif
          test -s dist/assets/dashboard-premium.webp
          test -s dist/assets/project-premium.webp
          test -s dist/assets/control-hero-v9.svg
          test -s dist/assets/project-hero-v9.svg
          test -s dist/assets/control-mountains.svg
          test -s dist/assets/project-workflow-art.svg
          test -s dist/build-info.js
          grep -q '"publicSnapshot": true' dist/state.json
          grep -q '"version": "0.13.0"' dist/state.json
          node -e "const s=require('./dist/state.json'); const c=s.settings?.lastChatgptInventory?.conversationCount||0; if((s.projects?.length||0)<18||(s.derived?.length||0)<17||c<131){throw new Error('Pages coverage regression: '+JSON.stringify({projects:s.projects?.length,derived:s.derived?.length,conversations:c}))}"
          if grep -q 'lastChatgptCatchup' dist/state.json; then
            echo 'Private ChatGPT catch-up diagnostics leaked into public snapshot'
            exit 1
          fi
          if grep -q 'chatgptInaccessible' dist/state.json; then
            echo 'Private inaccessible ChatGPT diagnostics leaked into public snapshot'
            exit 1
          fi
          if grep -q 'chatgptTimeoutQuarantine' dist/state.json; then
            echo 'Private ChatGPT timeout quarantine diagnostics leaked into public snapshot'
            exit 1
          fi
          if grep -q 'https://chatgpt.com/c/' dist/state.json; then
            echo 'Private ChatGPT conversation URL leaked into public snapshot'
            exit 1
          fi
          if grep -q 'extension/shino-sync' dist/state.json || grep -q '"componentId": "shino-sync"' dist/state.json; then
            echo 'Retired SHINO Sync component leaked into public snapshot'
            exit 1
          fi
