name: SHINO CONTROL Windows tray

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compile-tray:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile native tray app with Windows PowerShell
        shell: powershell
        run: |
          $source = Get-Content -LiteralPath 'scripts/windows/ShinoControlTray.cs' -Raw
          $out = Join-Path $env:RUNNER_TEMP 'SHINO-Control-Tray.exe'
          Add-Type `
            -TypeDefinition $source `
            -Language CSharp `
            -ReferencedAssemblies @('System.Windows.Forms','System.Drawing') `
            -OutputAssembly $out `
            -OutputType WindowsApplication
          if (-not (Test-Path -LiteralPath $out)) {
            throw 'Tray executable was not produced.'
          }
          $info = Get-Item -LiteralPath $out
          Write-Host "Tray compiled: $($info.FullName) ($($info.Length) bytes)"
      - name: Parse startup PowerShell
        shell: powershell
        run: |
          foreach ($file in @(
            'scripts/windows/control-supervisor.ps1',
            'scripts/windows/install-startup.ps1',
            'scripts/windows/startup-status.ps1',
            'scripts/windows/uninstall-startup.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_ }
              throw "PowerShell parse failed: $file"
            }
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify serialized-state concurrency on Windows
        run: node scripts-state-concurrency-check.mjs
      - name: Verify Collector ID persistence
        shell: powershell
        run: |
          $testId = 'abcdefghijklmnopabcdefghijklmnop'
          & .\scripts\windows\install-startup.ps1 -NoStart -NoTray -ExtensionId $testId

          $configPath = Join-Path $env:LOCALAPPDATA 'SHINO-Control\startup.json'
          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          if ([string]$config.extensionId -ne $testId) {
            throw "Collector ID was not persisted. Got '$($config.extensionId)'."
          }

          & .\scripts\windows\install-startup.ps1 -NoStart -NoTray
          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          if ([string]$config.extensionId -ne $testId) {
            throw "Collector ID was not preserved on reinstall. Got '$($config.extensionId)'."
          }

          & .\scripts\windows\uninstall-startup.ps1
